<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کارت موجودی محصول</title>
  <style>@import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap");</style>
  <style>
    :root {
      --text: #2b2b2b;
      --muted: #9aa0a6;
      --line: #ececec;
      --in: #1f9d55;
      --in-bg: #e8f8ee;
      --out: #c0392b;
      --out-bg: #fdecea;
      --card: #fff;
      --edit: #1a1a1a;
      --edit-hover: #000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--text);
    }

    .card {
      width: min(920px, 100%);
      background: var(--card);
      border-radius: 8px;
      padding: 22px 26px 22px;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .meta { 
      flex: 1; 
      min-width: 0; 
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-start;
      flex-direction: row;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      text-align: right;
      line-height: 1.4;
      color: #2a2a2a;
    }

    .edit-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #f8f8f8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: #4a4a4a;
      transition: background .15s, border-color .15s;
    }
    .edit-icon-btn:hover {
      background: #efefef;
      border-color: #e0e0e0;
    }
    .edit-icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .thumb {
      width: 132px;
      height: 132px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }

    .variant {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 20px;
    }

    .variant + .variant {
      border-top: 1px solid var(--line);
    }

    .info {
      text-align: right;
    }

    .discount {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e91e8c;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 0;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.in {
      background: var(--in-bg);
      color: var(--in);
    }

    .status.out {
      background: var(--out-bg);
      color: var(--out);
    }

    .size-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .size {
      font-size: 20px;
      font-weight: 700;
    }

    .stock-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--out);
      white-space: nowrap;
    }

    .stock-count.is-hidden {
      display: none;
    }

    .price {
      font-size: 20px;
      font-weight: 700;
      direction: rtl;
    }

    .price .currency {
      font-weight: 600;
      margin-right: 6px;
    }

    /* .edit-btn bottom removed per request */
  </style>
</head>
